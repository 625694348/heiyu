<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>一对一聊天</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="chat-box">
    <div class="top">💬 一对一私密聊天</div>
    <div id="msgList"></div>

    <div class="inputBox">
      <input type="text" id="msg" placeholder="输入消息...">
      <button onclick="sendText()">发送</button>
      <input type="file" id="imgFile" accept="image/*">
      <button onclick="sendImg()">发图</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
