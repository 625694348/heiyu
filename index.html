<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的个人导航</title>
  <link rel="stylesheet" href="style.css">
  <!-- 图标库 -->
  <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<div class="container">
  <!-- 顶部个人信息 -->
  <div class="profile">
    <div class="avatar"><i class="fa-solid fa-user"></i></div>
    <h1>我的个人导航</h1>
    <p>一站式快捷访问入口</p>
  </div>

  <!-- 分类：常用网站 -->
  <div class="card-group">
    <div class="card-title">常用网站</div>
    <div class="cards">
      
      <a class="card" href="https://github.com" target="_blank">
        <i class="fa-brands fa-github"></i>
        <span>GitHub</span>
      </a>

      <a class="card" href="https://www.baidu.com" target="_blank">
        <i class="fa-solid fa-search"></i>
        <span>百度</span>
      </a>

      <a class="card" href="https://www.bilibili.com" target="_blank">
        <i class="fa-brands fa-bilibili"></i>
        <span>B站</span>
      </a>

      <a class="card" href="https://mail.qq.com" target="_blank">
        <i class="fa-solid fa-envelope"></i>
        <span>QQ邮箱</span>
      </a>
    </div>
  </div>

  <!-- 分类：开发工具 -->
  <div class="card-group">
    <div class="card-title">开发工具</div>
    <div class="cards">
      
      <a class="card" href="https://code.visualstudio.com" target="_blank">
        <i class="fa-solid fa-code"></i>
        <span>VS Code</span>
      </a>

      <a class="card" href="https://chatgpt.com" target="_blank">
        <i class="fa-solid fa-robot"></i>
        <span>AI助手</span>
      </a>

      <a class="card" href="https://www.jsdelivr.com" target="_blank">
        <i class="fa-solid fa-box-archive"></i>
        <span>CDN</span>
      </a>

      <a class="card" href="https://www.cnblogs.com" target="_blank">
        <i class="fa-solid fa-pen"></i>
        <span>博客</span>
      </a>
    </div>
  </div>

  <!-- 分类：社交账号 -->
  <div class="card-group">
    <div class="card-title">社交联系</div>
    <div class="cards">
      
      <a class="card" href="https://space.bilib.com" target="_blank">
        <i class="fa-brands fa-bilibili"></i>
        <span>B站主页</span>
      </a>

      <a class="card" href="https://www.zhihu.com" target="_blank">
        <i class="fa-brands fa-zhihu"></i>
        <span>知乎</span>
      </a>

      <a class="card" href="#" target="_blank">
        <i class="fa-brands fa-weixin"></i>
        <span>微信</span>
      </a>

      <a class="card" href="#" target="_blank">
        <i class="fa-brands fa-qq"></i>
        <span>QQ</span>
      </a>
    </div>
  </div>

  <!-- 底部 -->
  <div class="footer">
    © 2025 My Navigation • All Rights Reserved
  </div>
</div>

</body>
</html>
